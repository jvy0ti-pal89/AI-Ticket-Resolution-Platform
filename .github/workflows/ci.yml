
name: CI

on:
	push:
		branches: [ master ]
	pull_request:
		branches: [ master ]

jobs:
	backend:
		name: Backend tests
		runs-on: ubuntu-latest
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Setup Python
				uses: actions/setup-python@v4
				with:
					python-version: '3.11'

			- name: Install backend dependencies
				run: |
					python -m pip install --upgrade pip
					pip install -r backend/requirements.txt

			- name: Run backend tests
				run: |
					cd backend
					pytest -q

	frontend:
		name: Frontend build
		runs-on: ubuntu-latest
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Setup Node
				uses: actions/setup-node@v4
				with:
					node-version: '18'

			- name: Install and build frontend
				run: |
					cd frontend
					npm ci
					npm run build
